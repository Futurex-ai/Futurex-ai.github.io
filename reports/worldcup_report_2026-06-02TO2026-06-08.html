    p_draw: "每行 = 一个 agent，每列 = 14 场小组赛中的一场。颜色表示<i>该 agent 选了什么</i>：蓝色 = 主队胜，<b>橙色 = 平局</b>，红色 = 客队胜。结论一目了然：<b>整张矩阵里几乎看不到橙色</b> —— 大多数 agent 从不选择平局，尽管实际上世界杯小组赛大约 25% 的比赛以平局收场。",
    draw_legend_T1: "主队胜",
    draw_legend_D:  "平局",
    draw_legend_T2: "客队胜",
    draw_legend_OTHER: "其他 / 多选",
    draw_legend_NA: "未作答",
    draw_yaxis: "Agent",
    draw_xaxis: "比赛",

    draw_summary: "28 个 agent 一共做了 <b>__N__</b> 个比赛胜负预测，其中只有 <b>__D__</b> 个是平局（<b>__P__</b>）。",

    h_qprob: "5 · 由「众包」推出的每题概率",
    p_qprob: "把 28 个 agent 在每题上的选择聚合成投票份额 —— 每个 agent 贡献 1 票，若多选则在所选选项间平均分摊。得到的<b>概率</b>就是各选项「agent 质量」的占比；<b>隐含赔率</b> = 1 / 概率（十进制）。最高项是 agent 群体的偏好，不等于真相。",
    tbl_meta: "信息", tbl_q: "题目", tbl_opt: "选项（概率 % · 赔率）",
    tbl_n: "n=",

    about_summary: "关于这份报告",
    about_body: "数据来自 <code>database/test_data/futurex-online/2026-06-02TO2026-06-08</code> 及最新的 <a href=\"https://huggingface.co/datasets/futurex-ai/Futurex-Online\">futurex-ai/Futurex-Online</a> 数据集。世界杯相关题目通过题目或 prompt 中包含「world cup」/「fifa」识别（不区分大小写）。Ground truth 尚未公布，所有指标仅反映答题风格与一致性。",
  },
};

let LANG = "en";

function t(key) { return I18N[LANG][key] ?? I18N.en[key] ?? key; }

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function applyStaticI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.title = (LANG === "zh"
    ? "FutureX 2026-06-02 ~ 06-08 · 世界杯答题风格分析"
    : "FutureX 2026-06-02 ~ 06-08 · World Cup Answer-Style Analysis");
  document.documentElement.lang = LANG;
}

// ---- Hero ----
function renderHero() {
  document.getElementById("hero").innerHTML = [
    [t("hero_q"),     DATA.n_questions + " / 130"],
    [t("hero_subs"),  DATA.n_subs],
    [t("hero_fams"),  new Set(DATA.rows.map(r => r.family)).size],

// ---- Similarity heatmap ----
function renderSim() {

// ---- Annotated quadrant scatter ----
function renderScatter() {
  const rows = DATA.rows;
  const med = arr => { const s = arr.slice().sort((a, b) => a - b); const n = s.length;
    return n ? (n % 2 ? s[(n - 1) >> 1] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; };
  const xMed = med(rows.map(r => r.consensus_pct));
  const yMed = med(rows.map(r => r.multi_pct));
  const xMin = Math.min(...rows.map(r => r.consensus_pct)) - 4;
  const xMax = Math.max(...rows.map(r => r.consensus_pct)) + 4;
  const yMin = -2;
  const yMax = Math.max(...rows.map(r => r.multi_pct)) + 4;

  const byFam = {};
  rows.forEach(r => { (byFam[r.family] = byFam[r.family] || []).push(r); });
  const traces = Object.entries(byFam).map(([fam, rs]) => ({
    type: "scatter", mode: "markers+text", name: fam,
    x: rs.map(r => r.consensus_pct),
    y: rs.map(r => r.multi_pct),
    text: rs.map(r => r.agent),
    textposition: "top center",
    textfont: { size: 10, color: "#334155" },
    marker: { size: 12, color: DATA.family_color[fam] || "#888",
              line: { width: 1.5, color: "#ffffff" } },
    hovertemplate: "<b>%{text}</b><br>" + t("sc_hover_cons") + ": %{x:.1f}%<br>"
                   + t("sc_hover_multi") + ": %{y:.1f}%<extra>" + fam + "</extra>",
  }));

  const tints = [
    { x0: xMin, x1: xMed, y0: yMed, y1: yMax, fill: "rgba(168,85,247,0.07)" },
    { x0: xMed, x1: xMax, y0: yMed, y1: yMax, fill: "rgba(34,197,94,0.07)" },
    { x0: xMin, x1: xMed, y0: yMin, y1: yMed, fill: "rgba(239,68,68,0.07)" },
    { x0: xMed, x1: xMax, y0: yMin, y1: yMed, fill: "rgba(59,130,246,0.07)" },
  ].map(r => ({ type: "rect", xref: "x", yref: "y",
                x0: r.x0, x1: r.x1, y0: r.y0, y1: r.y1,
                fillcolor: r.fill, line: { width: 0 }, layer: "below" }));
  const lines = [
    { type: "line", xref: "x", yref: "y", x0: xMed, x1: xMed, y0: yMin, y1: yMax,
      line: { color: "#94a3b8", width: 1, dash: "dash" } },
    { type: "line", xref: "x", yref: "y", x0: xMin, x1: xMax, y0: yMed, y1: yMed,
      line: { color: "#94a3b8", width: 1, dash: "dash" } },
  ];
  const corner = (x, y, title, sub, color, xa, ya) => ({
    x, y, xref: "x", yref: "y",
    text: title + "<br><span style='font-size:10px;opacity:.7'>" + sub + "</span>",
    showarrow: false, xanchor: xa, yanchor: ya,
    font: { size: 12, color }, opacity: 0.9,
  });
  const annotations = [
    corner(xMin + 0.5, yMax - 0.5, t("sc_q_tl"), t("sc_q_tl_sub"), "#7c3aed", "left",  "top"),
    corner(xMax - 0.5, yMax - 0.5, t("sc_q_tr"), t("sc_q_tr_sub"), "#15803d", "right", "top"),
    corner(xMin + 0.5, yMin + 0.5, t("sc_q_bl"), t("sc_q_bl_sub"), "#b91c1c", "left",  "bottom"),
    corner(xMax - 0.5, yMin + 0.5, t("sc_q_br"), t("sc_q_br_sub"), "#1d4ed8", "right", "bottom"),
    { x: xMed, y: yMax, xref: "x", yref: "y", text: " " + t("sc_med") + " " + xMed.toFixed(0) + "% ",
      showarrow: false, xanchor: "left", yanchor: "top", font: { size: 10, color: PLOTLY_MUTED } },
    { x: xMax, y: yMed, xref: "x", yref: "y", text: " " + t("sc_med") + " " + yMed.toFixed(0) + "% ",
      showarrow: false, xanchor: "right", yanchor: "bottom", font: { size: 10, color: PLOTLY_MUTED } },
  ];
  Plotly.react("chart_scatter", traces, {
    paper_bgcolor: PLOTLY_BG, plot_bgcolor: PLOTLY_BG,
    font: { color: PLOTLY_FG, size: 11 },
    margin: { l: 60, r: 30, t: 30, b: 70 },
    xaxis: { title: t("sc_x"), range: [xMin, xMax], gridcolor: PLOTLY_GRID, zeroline: false },
    yaxis: { title: t("sc_y"), range: [yMin, yMax], gridcolor: PLOTLY_GRID, zeroline: false },
    shapes: [...tints, ...lines],
    annotations,
    legend: { orientation: "h", y: -0.16 },
  }, { displayModeBar: false, responsive: true });
}

// ---- Highlights ----
function renderHighlights() {
  document.getElementById("unanimous_list").innerHTML = DATA.unanimous

       <span class="chip L${x.level}">L${x.level}</span>

     </div>`).join("");
  document.getElementById("divisive_list").innerHTML = DATA.divisive_top.map(x => {

    return `<div style="margin:8px 0;">
       <span class="chip L${x.level}">L${x.level}</span>
       <span class="small">entropy ${x.entropy.toFixed(2)}</span><br>
       ${escapeHtml(x.title)}
       <div class="small" style="margin-top:2px;">${v}</div>
     </div>`;

// ---- Draw-blindness heatmap (polished) ----
const DRAW_PALETTE = {
  T1:    "#60a5fa",  // soft blue
  D:     "#f97316",  // vivid orange — meant to pop
  T2:    "#f87171",  // soft red
  OTHER: "#cbd5e1",  // light slate
  NA:    "#e5e7eb",  // near-bg light gray
};
const PLOTLY_BG     = "#ffffff";
const PLOTLY_FG     = "#0f172a";
const PLOTLY_MUTED  = "#64748b";
const PLOTLY_GRID   = "#e2e8f0";
const PLOTLY_BORDER = "#ffffff";

function renderDraw() {
  const D = DATA.draw;

  // Sort: by family (so siblings group), then by # draws desc, then by agent name.
  // Within family preserves a clear visual block.
  const famOrder = Object.keys(DATA.family_color);
  const familyRank = f => {
    const i = famOrder.indexOf(f);
    return i < 0 ? 999 : i;
  };
  const order = D.agents.map((_, i) => i).sort((a, b) => {
    const fa = familyRank(D.families[a]), fb = familyRank(D.families[b]);
    if (fa !== fb) return fa - fb;
    if (D.counts[b].D !== D.counts[a].D) return D.counts[b].D - D.counts[a].D;
    return D.agents[a].localeCompare(D.agents[b]);
  });

  const z    = order.map(i => D.grid[i]);
  const text = order.map(i => D.text[i]);

  const cats = [
    [0, DRAW_PALETTE.T1,    t("draw_legend_T1")],
    [1, DRAW_PALETTE.D,     t("draw_legend_D")],
    [2, DRAW_PALETTE.T2,    t("draw_legend_T2")],
    [3, DRAW_PALETTE.OTHER, t("draw_legend_OTHER")],
    [4, DRAW_PALETTE.NA,    t("draw_legend_NA")],
  ];
  // Build a sharp-banded colorscale. With zmin=-0.5 / zmax=4.5, integer z=k
  // maps to position (k+0.5)/5 in [0,1]; each cat must occupy [k/5, (k+1)/5].
  const N = cats.length;
  const scale = [];
  cats.forEach(([_, c], i) => {
    scale.push([i / N, c]);
    scale.push([(i + 1) / N, c]);
  });

  // Y-tick labels are HTML-styled with the family color dot prefix
  const yLabels = order.map(i => {
    const c = DATA.family_color[D.families[i]] || "#888";
    const dCount = D.counts[i].D;
    const tag = dCount > 0
      ? `<span style="color:${DRAW_PALETTE.D};font-weight:600;">  ◆ ${dCount}</span>`
      : "";
    return `<span style="color:${c};">●</span>  ${D.agents[i]}${tag}`;
  });

  // Build per-row "count chips" annotations on the right edge — total draws
  // We add a thin extra column of annotations after the last match.
  const annotations = [];
  order.forEach((i, rowIdx) => {
    const dn = D.counts[i].D;
    if (dn > 0) {
      annotations.push({
        x: D.matches.length - 0.5 + 0.5, y: rowIdx,
        xref: "x", yref: "y",
        text: ` ${dn} draw${dn > 1 ? "s" : ""}`,
        showarrow: false, xanchor: "left", yanchor: "middle",
        font: { color: DRAW_PALETTE.D, size: 11, weight: 600 },
      });
    }
  });

  // Subtle separator lines between model families
  const sepShapes = [];
  for (let r = 1; r < order.length; r++) {
    if (D.families[order[r]] !== D.families[order[r - 1]]) {
      sepShapes.push({
        type: "line", xref: "x", yref: "y",
        x0: -0.5, x1: D.matches.length - 0.5,
        y0: r - 0.5, y1: r - 0.5,
        line: { color: "#ffffff", width: 3 },
      });
    }
  }

  Plotly.react("chart_draw", [{
    type: "heatmap",
    z, x: D.matches, y: yLabels, text,
    colorscale: scale, zmin: -0.5, zmax: 4.5, showscale: false,
    xgap: 2, ygap: 2,
    hovertemplate: "<b>%{y}</b><br>%{x}<br>" + t("draw_xaxis") + ": %{text}<extra></extra>",
  }], {
    paper_bgcolor: PLOTLY_BG, plot_bgcolor: PLOTLY_BG,
    font: { color: PLOTLY_FG, size: 11, family: "-apple-system,Segoe UI,Roboto,sans-serif" },
    margin: { l: 260, r: 110, t: 70, b: 30 },
    xaxis: { tickangle: -35, automargin: true, side: "top",
             showgrid: false, ticks: "", zeroline: false, tickfont: { size: 11 } },
    yaxis: { automargin: true, autorange: "reversed",
             showgrid: false, ticks: "", zeroline: false, tickfont: { size: 11 } },
    annotations,
    shapes: sepShapes,
  }, { displayModeBar: false, responsive: true });

  // Summary line + custom legend rendered as a header card above the chart
  const totalPicks = D.grid.reduce((s, row) => s + row.length, 0);
  let nD = 0;
  D.counts.forEach(c => nD += c.D);
  const pct = (nD / totalPicks * 100).toFixed(1) + "%";
  const summary = t("draw_summary")
    .replace("__N__", totalPicks)
    .replace("__D__", nD)
    .replace("__P__", pct);

  const legend = cats.map(([_, c, label]) =>
    `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:18px;">
       <span style="display:inline-block;width:12px;height:12px;background:${c};border-radius:3px;"></span>
       <span class="small">${label}</span>
     </span>`).join("");

  let header = document.getElementById("chart_draw_header");
  if (!header) {
    header = document.createElement("div");
    header.id = "chart_draw_header";
    header.style.cssText = "display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;padding:10px 14px;background:rgba(249,115,22,0.08);border:1px solid rgba(249,115,22,0.35);border-radius:10px;color:#0f172a;";
    const host = document.getElementById("chart_draw");
    host.parentNode.insertBefore(header, host);
  }
  header.innerHTML = `<div>${summary}</div><div>${legend}</div>`;
}

// ---- Per-question crowd probability table ----
function renderQprob() {
  const rows = DATA.qprob.map(q => {
    const top = q.options[0];
    const optHtml = q.options.map(o => {
      const pct = (o.prob * 100).toFixed(1);
      const odds = o.odds == null ? "—" : o.odds.toFixed(2);
      const isTop = o === top && o.prob > 0;
      const bg = isTop ? "background:#eef2ff;" : "";
      const labelShort = String(o.label).length > 48 ? String(o.label).slice(0, 45) + "…" : o.label;
      return `<div style="display:flex;justify-content:space-between;gap:8px;padding:2px 6px;border-radius:6px;${bg}">
        <span><b>${o.key}</b> <span class="small">${escapeHtml(labelShort)}</span></span>
        <span class="small" style="white-space:nowrap;">${pct}%  ·  ${odds}</span>
      </div>`;
    }).join("");
    const end = (q.end_time || "").replace("T", " ").slice(0, 16);
    return `<tr>
      <td style="vertical-align:top;white-space:nowrap;">
        <span class="chip L${q.level}">L${q.level}</span><br>
        <span class="small">${end}</span><br>
        <span class="small">${t("tbl_n")}${q.n_voters}</span>
      </td>
      <td style="vertical-align:top;">${escapeHtml(q.title)}</td>
      <td style="vertical-align:top;min-width:280px;">${optHtml}</td>
    </tr>`;
  }).join("");
  document.getElementById("qprob_wrap").innerHTML = `<table>
    <tr><th style="width:120px;">${t("tbl_meta")}</th><th>${t("tbl_q")}</th><th>${t("tbl_opt")}</th></tr>
    ${rows}
  </table>`;
}

function renderAll() {
  applyStaticI18n();
  renderHero();
  renderSim();
  renderScatter();
  renderHighlights();
  renderDraw();
  renderQprob();
  document.querySelectorAll("#langtoggle button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === LANG));
}

document.querySelectorAll("#langtoggle button").forEach(b =>
  b.addEventListener("click", () => { LANG = b.dataset.lang; renderAll(); }));

renderAll();
</script>
